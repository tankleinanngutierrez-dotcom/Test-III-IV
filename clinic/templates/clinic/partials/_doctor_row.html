<tr><td>#{{ doctor.pk }}</td><td><strong>{{ doctor.full_name }}</strong></td><td>{{ doctor.specialty.name }}</td><td>₱{{ doctor.consultation_fee|floatformat:2 }}</td><td>{% include "clinic/partials/_availability_badge.html" %}</td><td class="actions"><a href="{% url 'doctor_edit' doctor.pk %}">Edit</a><form method="post" action="{% url 'doctor_toggle' doctor.pk %}" hx-post="{% url 'doctor_toggle' doctor.pk %}" hx-target="closest tr" hx-swap="outerHTML">{% csrf_token %}<button class="text-button" type="submit">Toggle</button></form><form method="post" action="{% url 'doctor_delete' doctor.pk %}" onsubmit="return confirm('Delete this doctor?')">{% csrf_token %}<button class="text-button danger" type="submit">Delete</button></form></td></tr>
