<tr x-show="active==='All' || active==='{{ appointment.status }}'" data-status="{{ appointment.status }}"><td><strong>{{ appointment.reference_number }}</strong></td><td>{{ appointment.patient_name }}</td><td>{{ appointment.doctor.full_name }}</td><td>{{ appointment.appointment_date|date:"M j, Y" }}</td><td>{{ appointment.time_slot }}</td><td><span class="status-tag {{ appointment.status|lower }}">{{ appointment.status }}</span></td><td class="actions">{% if appointment.status == "Pending" %}<form method="post" action="{% url 'appointment_status' appointment.pk 'Confirmed' %}" hx-post="{% url 'appointment_status' appointment.pk 'Confirmed' %}" hx-target="closest tr" hx-swap="outerHTML">{% csrf_token %}<button class="text-button" type="submit">Confirm</button></form><button class="text-button danger" type="button" @click="$dispatch('open-cancel',{url:'{% url 'appointment_status' appointment.pk 'Cancelled' %}'})">Cancel</button>{% else %}—{% endif %}</td></tr>
